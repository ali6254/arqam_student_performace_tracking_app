services:
  db:
    image: postgres:16-alpine
    container_name: behavior_points_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: behavior_points
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d behavior_points"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
